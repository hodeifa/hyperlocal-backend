syntax = "proto3";
package customer.v1;
option go_package = "github.com/hodeifa/hyperlocal-backend/proto/customer/v1;customer";

service CustomerService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc VerifyOTP(VerifyOTPRequest) returns (VerifyOTPResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc RevokeAll(RevokeAllRequest) returns (RevokeAllResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc GetAddresses(GetAddressesRequest) returns (GetAddressesResponse);
}

message RegisterRequest { string phone_number = 1; string name = 2; }
message RegisterResponse { string customer_id = 1; }

message VerifyOTPRequest { string phone_number = 1; string otp = 2; }
message VerifyOTPResponse { 
  string access_token = 1; 
  string refresh_token = 2; 
  bool has_driver_role = 3; // Untuk banner cross-promo
}

message LoginRequest { string phone_number = 1; }
message LoginResponse { bool otp_sent = 1; }
message RefreshTokenRequest { string refresh_token = 1; }
message RefreshTokenResponse { string access_token = 1; string refresh_token = 2; }
message RevokeAllRequest { string customer_id = 1; }
message RevokeAllResponse { bool success = 1; }

message GetProfileRequest { string customer_id = 1; }
message GetProfileResponse { 
  string name = 1; 
  string phone_number = 2; 
  string photo_url = 3; // [FIX] Ditambahkan kembali
}

message GetAddressesRequest { string customer_id = 1; }
message Address {
  string id = 1;
  string label = 2;
  string address = 3;
  double latitude = 4;
  double longitude = 5;
}
message GetAddressesResponse { repeated Address addresses = 1; }