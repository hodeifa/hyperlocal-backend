syntax = "proto3";

package customer.v1;

option go_package = "github.com/hodeifa/hyperlocal-backend/proto/customer/v1;customer";

// CustomerService menangani autentikasi dan profil pelanggan
service CustomerService {
  // Register mendaftarkan nomor HP baru dan mengirim OTP.
  // Stateless: tidak melakukan INSERT ke DB. Pembuatan row customers
  // ditunda hingga /verify-otp setelah kepemilikan nomor terbukti.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Method lain bisa ditambahkan di sini saat dibutuhkan:
  // rpc VerifyOTP(VerifyOTPRequest) returns (VerifyOTPResponse);
  // rpc Login(LoginRequest) returns (LoginResponse);
  // rpc Refresh(RefreshRequest) returns (RefreshResponse);
}

// RegisterRequest — hanya menerima nomor HP.
// Field 'name' sengaja tidak disertakan (reserved) karena:
// (1) nama diminta di layar terpisah (PATCH /profile) sesuai blueprint-ui.md
// (2) /register bersifat stateless, tidak ada INSERT ke DB di sini
message RegisterRequest {
  string phone_number = 1; // Format E.164, wajib prefix +62 (divalidasi di Gateway)
  reserved 2; // Bekas field 'name' — jangan dipakai ulang
}

// RegisterResponse — dikembalikan setelah OTP berhasil dikirim (simulasi di Sprint 4)
message RegisterResponse {
  string message = 1;       // Pesan sukses, misal: "OTP berhasil dikirim"
  bool has_driver_role = 2; // true jika nomor HP juga terdaftar di tabel drivers
                            // Dipakai Customer App untuk tampilkan banner cross-promo
                            // "Download Mitra App" (blueprint.md Dual-Role v2.3)
}